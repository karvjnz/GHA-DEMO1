name: Environment Variable Demo
on: workflow_dispatch
env:
  APP_ENV: "Development"      # Environment Variable can be comfigured at "Workflow Level"
jobs:
  environment_variable_demo:
    env:
      APP_ENV: "Test"      # Environment Variable can be comfigured at "Job Level"
    runs-on: ubuntu-latest
    steps:
      - name: Connecting to environment
        env:
          APP_ENV: "Production"      # Environment Variable can be comfigured at "Job Level"      
        run: echo "Application is Connecting to $APP_ENV"
        
  # Note: Environment Variable can be comfigured at 1. Workflow Level, or 2. at Job level or 3. at Steps level
  # we have give three environment lable at 3 levels just to check which takes the preciding 
